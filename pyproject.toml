[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medextract"
version = "1.0.0"
description = "Vietnamese clinical concept extraction + ICD-10/RxNorm linking (AI Race 2026, Task 2)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Dương Trường Bình"}]
# Tested with torch 2.13 + transformers 5.6.2 (CUDA 13, Python 3.12); the floors
# below are the minimum supported versions.
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "gliner>=0.2.20",
    "faiss-cpu>=1.7",
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "Jinja2>=3.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "jiwer>=3.0",
]
keywords = ["ner", "clinical-nlp", "vietnamese", "icd-10", "rxnorm", "gliner", "qwen"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/duongtruongbinh/viettel_ai_race_task2"

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43", "accelerate>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medextract = ["py.typed", "prompts/*.jinja"]
